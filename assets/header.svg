<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Muhammad Noman — Full-Stack Engineer, AI and secure application development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2a37" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .name { font-size: 40px; font-weight: 700; fill: #e6edf3; }
      .role { font-size: 18px; fill: #8b949e; }
      .prompt { font-size: 14px; fill: #3fb950; }
      .h { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #58a6ff; }
      .li { font-size: 13.5px; fill: #c9d1d9; }
      .dot { fill: #3fb950; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="998" height="298" rx="14" fill="url(#grid)" opacity=".55"/>
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#accent)"/>

  <!-- window chrome -->
  <circle cx="30" cy="30" r="6" fill="#f85149"/>
  <circle cx="50" cy="30" r="6" fill="#d29922"/>
  <circle cx="70" cy="30" r="6" fill="#3fb950"/>
  <text x="92" y="35" class="mono" font-size="13" fill="#6e7681">~/muhammadnoman2 — profile</text>

  <!-- identity -->
  <text x="40" y="92" class="mono prompt">$ whoami</text>
  <text x="40" y="138" class="sans name">Muhammad Noman</text>
  <text x="40" y="168" class="sans role">Full-Stack Engineer · AI &amp; Secure Application Development</text>
  <text x="40" y="196" class="mono" font-size="13" fill="#6e7681">Islamabad, Pakistan  ·  Software Engineer at MK Technology Pvt Ltd</text>
  <text x="40" y="250" class="mono prompt">$ building AI systems — and securing them<tspan class="cursor" fill="#e6edf3"> ▋</tspan></text>

  <!-- focus columns -->
  <line x1="560" y1="70" x2="560" y2="262" stroke="#30363d"/>

  <g transform="translate(590,86)">
    <circle cx="5" cy="-4" r="4" class="dot pulse"/>
    <text x="16" y="0" class="sans h">AI ENGINEERING</text>
    <text x="16" y="24" class="sans li">LLM apps · RAG · AI agents</text>
    <text x="16" y="44" class="sans li">LangGraph · FastAPI · evaluation</text>
  </g>
  <g transform="translate(590,160)">
    <circle cx="5" cy="-4" r="4" class="dot pulse" style="animation-delay:.8s"/>
    <text x="16" y="0" class="sans h">AI &amp; APP SECURITY</text>
    <text x="16" y="24" class="sans li">Prompt-injection defense · RAG security</text>
    <text x="16" y="44" class="sans li">Agent tool permissions · threat modeling</text>
  </g>
  <g transform="translate(590,234)">
    <circle cx="5" cy="-4" r="4" class="dot pulse" style="animation-delay:1.6s"/>
    <text x="16" y="0" class="sans h">FULL-STACK &amp; REALTIME</text>
    <text x="16" y="24" class="sans li">Flutter · Node.js/TypeScript · WebSockets · Linux/VPS</text>
  </g>
</svg>
