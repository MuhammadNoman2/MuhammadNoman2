name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Skip when METRICS_TOKEN is not configured
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::Add a scope-less personal access token as the METRICS_TOKEN repository secret to enable metrics."

      # lowlighter/metrics v3.34 (MIT), pinned to a commit SHA
      - name: Generate metrics
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ env.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_message: "Update metrics"
          filename: metrics.svg
          template: classic
          config_display: large
          config_timezone: Asia/Karachi
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, jupyter notebook, c, cmake, c++, swift, objective-c
          plugin_languages_limit: 8
          # plugin_achievements is off: its query uses Projects (classic) fields, which GitHub
          # has retired, so it only renders "Unexpected error" (lowlighter/metrics is unmaintained).
